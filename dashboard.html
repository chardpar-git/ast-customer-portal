<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AST Customer Portal</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at top left,
          rgba(255, 255, 255, 0.16),
          transparent 38%
        ),
        linear-gradient(135deg, #002b80, #075ee8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 0;
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.26);
    }

    .logo {
      width: 92px;
      height: 92px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .portal-title {
      color: #082f73;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .portal-subtitle {
      color: #667085;
      margin-bottom: 28px;
    }

    .form-label {
      color: #344054;
      font-weight: 600;
    }

    .input-group-text {
      background: #f8fafc;
      border-right: 0;
    }

    .form-control {
      min-height: 52px;
      border-left: 0;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #86b7fe;
    }

    .login-button {
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #0646c7, #0d6efd);
      font-weight: 700;
    }

    .login-button:hover {
      background: linear-gradient(135deg, #043ba8, #0757d4);
    }

    .message-box {
      display: none;
      margin-top: 18px;
    }

    .footer-text {
      color: #98a2b3;
      font-size: 13px;
      text-align: center;
      margin-top: 26px;
      margin-bottom: 0;
    }

    .security-note {
      color: #667085;
      font-size: 13px;
      margin-top: 16px;
      text-align: center;
    }

    @media (max-width: 576px) {
      body {
        padding: 15px;
      }

      .login-card {
        padding: 26px 20px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="text-center">
      <img
        src="images/logo.png"
        alt="AST Networks"
        class="logo"
        onerror="this.style.display='none'"
      >

      <h1 class="portal-title h3">
        AST Customer Portal
      </h1>

      <p class="portal-subtitle">
        Check your internet voucher balance and usage
      </p>
    </div>

    <form id="loginForm" novalidate>

      <label for="tokenInput" class="form-label">
        Internet Voucher / Token
      </label>

      <div class="input-group mb-3">
        <span class="input-group-text">
          <i class="bi bi-key"></i>
        </span>

        <input
          type="text"
          id="tokenInput"
          class="form-control"
          placeholder="Enter your voucher token"
          autocomplete="off"
          inputmode="numeric"
          maxlength="50"
          required
        >
      </div>

      <button
        type="submit"
        id="loginButton"
        class="btn btn-primary login-button w-100"
      >
        <span id="buttonText">
          <i class="bi bi-box-arrow-in-right me-1"></i>
          Check Usage
        </span>

        <span
          id="buttonLoading"
          class="d-none"
        >
          <span
            class="spinner-border spinner-border-sm me-2"
            aria-hidden="true"
          ></span>
          Checking token...
        </span>
      </button>

      <div
        id="messageBox"
        class="alert message-box"
        role="alert"
      ></div>

    </form>

    <p class="security-note">
      <i class="bi bi-shield-check me-1"></i>
      Your connection is handled securely through AST Networks.
    </p>

    <p class="footer-text">
      Powered by AST Networks
    </p>

  </main>

  <script>
    const API_URL =
      "https://oracxulqmnjwjsfjrre.supabase.co/functions/v1/rapid-endpoint";

    const loginForm = document.getElementById("loginForm");
    const tokenInput = document.getElementById("tokenInput");
    const loginButton = document.getElementById("loginButton");
    const buttonText = document.getElementById("buttonText");
    const buttonLoading = document.getElementById("buttonLoading");
    const messageBox = document.getElementById("messageBox");

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const token = tokenInput.value.trim();

      hideMessage();

      if (!token) {
        showMessage(
          "Please enter your internet voucher token.",
          "warning"
        );

        tokenInput.focus();
        return;
      }

      setLoading(true);

      try {
        const requestUrl =
          `${API_URL}?token=${encodeURIComponent(token)}`;

        const response = await fetch(requestUrl, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        let result;

        try {
          result = await response.json();
        } catch {
          throw new Error(
            "The server returned an invalid response."
          );
        }

        if (!response.ok || result.success !== true) {
          throw new Error(
            result.message ||
            "Voucher token was not found."
          );
        }

        if (result.valid === false) {
          throw new Error(
            "This voucher token is not valid."
          );
        }

        if (result.expired === true) {
          throw new Error(
            "This voucher token has expired."
          );
        }

        sessionStorage.setItem(
          "ast_customer_token",
          token
        );

        sessionStorage.setItem(
          "ast_token_data",
          JSON.stringify(result)
        );

        window.location.href = "dashboard.html";

      } catch (error) {
        console.error("Token lookup failed:", error);

        showMessage(
          error.message ||
          "Unable to check the voucher. Please try again.",
          "danger"
        );

      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      loginButton.disabled = isLoading;
      tokenInput.disabled = isLoading;

      buttonText.classList.toggle("d-none", isLoading);
      buttonLoading.classList.toggle("d-none", !isLoading);
    }

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className =
        `alert alert-${type} message-box`;

      messageBox.style.display = "block";
    }

    function hideMessage() {
      messageBox.style.display = "none";
      messageBox.textContent = "";
    }
  </script>

</body>
</html>
