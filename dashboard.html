<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AST Customer Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

<div class="container">

<a class="navbar-brand fw-bold" href="#">
<i class="bi bi-globe2"></i>
AST Customer Portal
</a>

<button class="btn btn-outline-light btn-sm" onclick="logout()">
<i class="bi bi-box-arrow-right"></i>
Logout
</button>

</div>

</nav>

<div class="container mt-4">

<div class="mb-4">

<h3 id="welcome"></h3>

<p class="text-muted">
Monitor your internet usage and account information.
</p>

</div>

<div class="row g-4">

<div class="col-lg-3 col-md-6">

<div class="card dashboard-card">

<div class="card-body">

<i class="bi bi-wifi text-success icon"></i>

<h6>Status</h6>

<h4 class="text-success">ONLINE</h4>

</div>

</div>

</div>

<div class="col-lg-3 col-md-6">

<div class="card dashboard-card">

<div class="card-body">

<i class="bi bi-router text-primary icon"></i>

<h6>Current WAN</h6>

<h4>Starlink</h4>

</div>

</div>

</div>

<div class="col-lg-3 col-md-6">

<div class="card dashboard-card">

<div class="card-body">

<i class="bi bi-database text-warning icon"></i>

<h6>Remaining Data</h6>

<h4>2.34 GB</h4>

</div>

</div>

</div>

<div class="col-lg-3 col-md-6">

<div class="card dashboard-card">

<div class="card-body">

<i class="bi bi-calendar-event text-danger icon"></i>

<h6>Expiry</h6>

<h4>12 Aug 2026</h4>

</div>

</div>

</div>

</div>

<div class="card shadow-sm mt-4">

<div class="card-body">

<h5>Remaining Data Usage</h5>

<div class="progress mt-3" style="height:25px;">

<div class="progress-bar progress-bar-striped progress-bar-animated"

style="width:46%;">

46%

</div>

</div>

<p class="mt-3 mb-0">

2.34 GB remaining of 5 GB Plan

</p>

</div>

</div>

<div class="row mt-4">

<div class="col-md-6">

<button class="btn btn-success w-100">

<i class="bi bi-cart-fill"></i>

<div class="card shadow-sm mt-4">

    <div class="card-body">

        <h5>
            <i class="bi bi-graph-up"></i>
            Internet Usage (Last 7 Days)
        </h5>

        <canvas id="usageChart" height="100"></canvas>

    </div>

</div>  
Buy More Data

</button>

</div>

<div class="col-md-6">

<button class="btn btn-secondary w-100">

<i class="bi bi-arrow-clockwise"></i>

Refresh

</button>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/charts.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
