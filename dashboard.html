<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AST Customer Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container-fluid">
        <span class="navbar-brand">
            <i class="bi bi-globe"></i>
            AST Customer Portal
        </span>

        <button class="btn btn-outline-light btn-sm" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </button>
    </div>
</nav>

<div class="container py-4">

    <h3 id="welcome"></h3>

    <div class="row g-4 mt-2">

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-wifi fs-1 text-success"></i>
                    <h5>Status</h5>
                    <h4 class="text-success">Online</h4>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-router fs-1 text-primary"></i>
                    <h5>Current WAN</h5>
                    <h4>Starlink</h4>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-database fs-1 text-warning"></i>
                    <h5>Remaining</h5>
                    <h4>2.34 GB</h4>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-calendar-event fs-1 text-danger"></i>
                    <h5>Expiry</h5>
                    <h4>12 Aug</h4>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
